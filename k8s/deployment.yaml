apiVersion: apps/v1
kind: Deployment
metadata:
  name: l00205530-flask
  labels:
    app: l00205530-flask
spec:
  replicas: 2
  selector:
    matchLabels:
      app: l00205530-flask
  template:
    metadata:
      labels:
        app: l00205530-flask
    spec:
      containers:
        - name: flask
          image: ghcr.io/l00205530/l00205530-devops-mini-pipeline@sha256:892c6a96183d1d09e2514c3d90d6a75464af58c00fbca6c2bd2a9f55659030ec
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
