apiVersion: apps/v1
kind: Deployment
metadata:
  name: l00205530-flask
  labels:
    app: l00205530-flask
spec:
  replicas: 2
  selector:
    matchLabels:
      app: l00205530-flask
  template:
    metadata:
      labels:
        app: l00205530-flask
    spec:
      containers:
        - name: flask
          image: ghcr.io/l00205530/l00205530-devops-mini-pipeline@sha256:08fccb61e0ddded4a4282a0f83d6c6342d7ff32d281f495e4eb30dc658ec9a28
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
