name: L00205530 - CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and Test Flask Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python source
        run: |
          python -m compileall -q app

      - name: Run automated tests with coverage
        run: |
          python -m pytest -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=90
      - name: Ruff static code analysis
        run: |
          ruff check app/ tests/
      - name: Bandit security analysis
        run: |
          bandit -r app/ -ll    
      - name: Trivy dependency vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: L00205530-coverage-report
          path: coverage.xml


  docker-validation:
    name: Docker Build and Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Docker image
        run: |
          docker build \
            -t l00205530-devops-mini-pipeline:ci \
            .

      - name: Run container smoke test
        run: |
          docker run -d \
            --name l00205530-ci \
            -p 127.0.0.1:5000:5000 \
            l00205530-devops-mini-pipeline:ci

          for attempt in {1..15}; do
            if curl --fail --silent \
              http://127.0.0.1:5000/health | \
              grep -q '"status":"healthy"'; then
              echo "Container health check passed"
              exit 0
            fi
            sleep 2
          done

          echo "Container health check failed"
          docker logs l00205530-ci
          exit 1

      - name: Verify non-root container user
        run: |
          docker exec l00205530-ci id
          test "$(docker exec l00205530-ci id -u)" = "10001"

      - name: Trivy container image vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'l00205530-devops-mini-pipeline:ci'
          scanners: 'vuln'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

      - name: Show container logs
        if: always()
        run: |
          docker logs l00205530-ci 2>&1 || true
  publish-image:
    name: Publish Docker Image to GHCR
    runs-on: ubuntu-latest

    needs:
      - build-and-test
      - docker-validation

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/l00205530/l00205530-devops-mini-pipeline
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
