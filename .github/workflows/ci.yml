name: L00205530 - CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and Test Flask Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python source
        run: |
          python -m compileall -q app

      - name: Run automated tests with coverage
        run: |
          python -m pytest -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=90
      - name: Ruff static code analysis
        run: |
          ruff check app/ tests/
      - name: Bandit security analysis
        run: |
          bandit -r app/ -ll    
      - name: Trivy dependency vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'
          severity: 'HIGH, CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: L00205530-coverage-report
          path: coverage.xml
