
# L00205530 - Prometheus monitoring configuration

alertmanager:
  enabled: false

prometheus-pushgateway:
  enabled: false

prometheus-node-exporter:
  enabled: false

kube-state-metrics:
  enabled: false

server:
  replicaCount: 1

  persistentVolume:
    enabled: false

  retention: "24h"

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

  global:
    scrape_interval: 15s
    evaluation_interval: 15s

extraScrapeConfigs: |
  - job_name: 'l00205530-flask'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - default

    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: l00205530-flask
        action: keep

      - source_labels: [__meta_kubernetes_pod_container_name]
        regex: flask
        action: keep

      - source_labels: [__meta_kubernetes_pod_container_port_number]
        regex: "5000"
        action: keep

      - source_labels: [__meta_kubernetes_pod_ready]
        regex: "true"
        action: keep

      - source_labels: [__meta_kubernetes_pod_ip]
        target_label: pod_ip

      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

    metrics_path: /metrics
    scheme: http
