
# L00205530 - Prometheus monitoring configuration

alertmanager:
  enabled: false

prometheus-pushgateway:
  enabled: false

prometheus-node-exporter:
  enabled: false

kube-state-metrics:
  enabled: false

server:
  replicaCount: 1

  persistentVolume:
    enabled: false

  retention: "24h"

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

  global:
    scrape_interval: 15s
    evaluation_interval: 15s

extraScrapeConfigs: |
  - job_name: 'l00205530-flask'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - default

    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: l00205530-flask
        action: keep

      - source_labels: [__meta_kubernetes_pod_container_name]
        regex: flask
        action: keep

      - source_labels: [__meta_kubernetes_pod_container_port_number]
        regex: "5000"
        action: keep

      - source_labels: [__meta_kubernetes_pod_ready]
        regex: "true"
        action: keep

      - source_labels: [__meta_kubernetes_pod_ip]
        target_label: pod_ip

      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

    metrics_path: /metrics
    scheme: http

# L00205530 - Prometheus alerting rules
serverFiles:
  alerting_rules.yml:
    groups:
      - name: l00205530-flask-alerts
        interval: 15s
        rules:
          - alert: FlaskReplicaAvailabilityLow
            expr: |
              (sum(up{job="l00205530-flask"}) or vector(0)) < 2
            for: 2m
            labels:
              severity: warning
              application: l00205530-flask
            annotations:
              summary: "Flask replica availability below expected level"
              description: "Fewer than two Flask targets have been successfully scraped for two minutes."

          - alert: FlaskHighHTTPErrorRate
            expr: |
              (
                (
                  sum(rate(flask_http_requests_total{job="l00205530-flask",status=~"5.."}[5m]))
                  or vector(0)
                )
                /
                clamp_min(
                  sum(rate(flask_http_requests_total{job="l00205530-flask"}[5m])),
                  0.001
                )
              ) > 0.05
              and
              sum(rate(flask_http_requests_total{job="l00205530-flask"}[5m])) > 0.1
            for: 5m
            labels:
              severity: warning
              application: l00205530-flask
            annotations:
              summary: "High Flask HTTP 5xx error rate"
              description: "HTTP 5xx responses exceed 5 percent of requests during sustained traffic."
