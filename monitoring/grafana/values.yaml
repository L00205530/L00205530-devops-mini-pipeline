
# L00205530 - Grafana monitoring configuration

replicas: 1

persistence:
  enabled: false

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

admin:
  existingSecret: grafana-admin

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.monitoring.svc.cluster.local
        isDefault: true
        editable: false

# Provision dashboards from a Kubernetes ConfigMap.
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: 'L00205530 Dashboards'
        orgId: 1
        folder: 'DevOps Monitoring'
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /var/lib/grafana/dashboards/l00205530

dashboardsConfigMaps:
  l00205530: l00205530-grafana-dashboards
